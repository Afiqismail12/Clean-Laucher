name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Cipta fail projek
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "CleanLauncher"
          include(":app")
          EOF_0
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF_2'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF_2
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.clean.launcher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.clean.launcher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"))
                  }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.recyclerview:recyclerview:1.3.2")
          }
          EOF_3
          mkdir -p $(dirname app/proguard-rules.pro)
          cat > app/proguard-rules.pro <<'EOF_4'
          -keep class com.clean.launcher.** { *; }
          EOF_4
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- Sengaja TIADA permission INTERNET: launcher ini tidak boleh paparkan iklan atau hantar data -->
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:label="Clean Launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.Wallpaper.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:excludeFromRecents="true"
                      android:windowSoftInputMode="adjustPan">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_5
          mkdir -p $(dirname app/src/main/res/layout/activity_main.xml)
          cat > app/src/main/res/layout/activity_main.xml <<'EOF_6'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:fitsSystemWindows="true"
              android:background="#66000000" android:padding="8dp">
              <EditText android:id="@+id/search"
                  android:layout_width="match_parent" android:layout_height="48dp"
                  android:hint="Cari aplikasi鈥�" android:singleLine="true"
                  android:textColor="#FFFFFF" android:textColorHint="#BBFFFFFF"
                  android:paddingStart="16dp" android:background="#33FFFFFF" />
              <androidx.recyclerview.widget.RecyclerView android:id="@+id/list"
                  android:layout_width="match_parent" android:layout_height="0dp"
                  android:layout_weight="1" android:paddingTop="8dp"
                  android:clipToPadding="false" android:overScrollMode="never" />
          </LinearLayout>
          EOF_6
          mkdir -p $(dirname app/src/main/res/layout/item_app.xml)
          cat > app/src/main/res/layout/item_app.xml <<'EOF_7'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:orientation="vertical" android:gravity="center_horizontal"
              android:padding="8dp" android:background="?android:attr/selectableItemBackground">
              <ImageView android:id="@+id/icon" android:layout_width="52dp" android:layout_height="52dp" />
              <TextView android:id="@+id/label" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:gravity="center"
                  android:maxLines="1" android:ellipsize="end" android:textSize="11sp"
                  android:textColor="#FFFFFF" android:paddingTop="4dp" />
          </LinearLayout>
          EOF_7
          mkdir -p $(dirname app/src/main/java/com/clean/launcher/MainActivity.kt)
          cat > app/src/main/java/com/clean/launcher/MainActivity.kt <<'EOF_8'
          package com.clean.launcher

          import android.app.Activity
          import android.content.*
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.*
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import java.util.concurrent.Executors

          data class AppItem(val label: String, val pkg: String, val intent: Intent)

          class MainActivity : Activity() {
              private val io = Executors.newSingleThreadExecutor()
              private val adapter = AppAdapter()
              private var all: List<AppItem> = emptyList()

              private val pkgReceiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) = loadApps()
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  setContentView(R.layout.activity_main)
                  val list = findViewById<RecyclerView>(R.id.list)
                  list.layoutManager = GridLayoutManager(this, 4)
                  list.setHasFixedSize(true)
                  list.adapter = adapter
                  findViewById<EditText>(R.id.search).addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) = filter(s?.toString().orEmpty())
                      override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                  })
                  val f = IntentFilter().apply {
                      addAction(Intent.ACTION_PACKAGE_ADDED); addAction(Intent.ACTION_PACKAGE_REMOVED)
                      addDataScheme("package")
                  }
                  registerReceiver(pkgReceiver, f)
                  loadApps()
              }

              override fun onDestroy() { unregisterReceiver(pkgReceiver); io.shutdown(); super.onDestroy() }

              // Butang Home: kosongkan carian & skrol ke atas
              override fun onNewIntent(i: Intent?) {
                  super.onNewIntent(i)
                  findViewById<EditText>(R.id.search).setText("")
                  findViewById<RecyclerView>(R.id.list).scrollToPosition(0)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() { /* launcher tidak keluar */ }

              private fun loadApps() = io.execute {
                  val q = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val pm = packageManager
                  val items = pm.queryIntentActivities(q, 0)
                      .filter { it.activityInfo.packageName != packageName }
                      .map {
                          AppItem(it.loadLabel(pm).toString(), it.activityInfo.packageName,
                              Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                                  .setClassName(it.activityInfo.packageName, it.activityInfo.name)
                                  .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      }.sortedBy { it.label.lowercase() }
                  runOnUiThread { all = items; filter(findViewById<EditText>(R.id.search).text.toString()) }
              }

              private fun filter(q: String) {
                  adapter.submit(if (q.isBlank()) all else all.filter { it.label.contains(q, true) })
              }

              inner class AppAdapter : RecyclerView.Adapter<AppAdapter.VH>() {
                  private var data: List<AppItem> = emptyList()
                  fun submit(d: List<AppItem>) { data = d; notifyDataSetChanged() }
                  inner class VH(v: View) : RecyclerView.ViewHolder(v) {
                      val icon: ImageView = v.findViewById(R.id.icon)
                      val label: TextView = v.findViewById(R.id.label)
                  }
                  override fun onCreateViewHolder(p: ViewGroup, t: Int) =
                      VH(LayoutInflater.from(p.context).inflate(R.layout.item_app, p, false))
                  override fun getItemCount() = data.size
                  override fun onBindViewHolder(h: VH, pos: Int) {
                      val a = data[pos]
                      h.label.text = a.label
                      h.icon.setImageDrawable(packageManager.getApplicationIcon(a.pkg))
                      h.itemView.setOnClickListener { startActivity(a.intent) }
                      h.itemView.setOnLongClickListener {
                          startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                              Uri.parse("package:${a.pkg}")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                          true
                      }
                  }
              }
          }
          EOF_8
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CleanLauncher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
